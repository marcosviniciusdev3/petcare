
name: Check if protected files have being modified on blocked branches

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

jobs:
  changed_files:
    name: Test changed files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@1254cca6ac8b9c3047ba83a11b20c9dd8d9b0572

